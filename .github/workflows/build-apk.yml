# Builds an installable Android APK and attaches it as a downloadable
# workflow artifact — for the "I don't have a computer, just give me the
# APK" reports the install guide currently has no answer for.
#
# MANUAL DISPATCH ONLY, on purpose (not wired to `on: push` or `on: release`
# yet). What this produces has real caveats the owner should decide about
# before pointing users at it:
#
#   - assembleDebug is signed with Android's shared debug keystore, not a
#     real release key. It installs fine over USB/sideload today, but if the
#     project later ships a properly-signed release, anyone on a debug build
#     must uninstall before installing that one (Android refuses to update
#     an app in place across different signing keys).
#   - assembleRelease here is UNSIGNED (no signingConfig is set in
#     android/app/build.gradle.kts) and will not install as-is; a signed
#     release additionally needs: a generated upload keystore kept as a
#     GitHub secret (not committed), a `signingConfig` wired into
#     android/app/build.gradle.kts, and — per README "What's not done" —
#     Android rule-bundle signature verification, which does not exist yet.
#     Do not distribute a release build as the "safe" download until that
#     lands.
#   - Six of the eight services ship BETA (README) regardless of which build
#     type this produces.
#
# Once the owner has a real signing key and wants this attached to releases
# automatically, add `release: { types: [published] }` to `on:` below.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "assembleDebug = debug-signed, installs directly. assembleRelease = unsigned, needs a signing step before install."
        type: choice
        options:
          - assembleDebug
          - assembleRelease
        default: assembleDebug

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: engine/pnpm-lock.yaml }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # The APK must ship the engine + rules it was built with — same
      # requirement tools/sync-engine.sh exists to enforce for local builds.
      - run: pnpm install --dir engine
      - run: node tools/sync-engine.mjs

      - run: cd android && ./gradlew :app:testDebugUnitTest ":app:${{ inputs.build_type }}"

      - uses: actions/upload-artifact@v4
        with:
          name: noscroll-${{ inputs.build_type }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
